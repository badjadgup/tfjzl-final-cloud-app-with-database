{% extends 'onlinecourse/base.html' %}
{% block content %}
<h1>Sign in</h1>
{% if form.errors %}<p class="alert alert-danger">The username or password was not accepted.</p>{% endif %}
<form method="post" class="card card-body" style="max-width: 32rem">
  {% csrf_token %}{{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary">Sign in</button>
</form>
{% endblock %}
